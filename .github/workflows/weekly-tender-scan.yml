name: Weekly Tender Scan

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * 0"

jobs:
  tender-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil PyPDF2 pdfminer.six openai

      - name: Run tender scan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tender_scan.py \
            --days 8 \
            --pages 1000 \
            --download_dir recent_downloads \
            --analyze_openai

      - name: Create mail summary
        id: mail_summary
        run: |
          python go_mail_report.py \
            --results recent_downloads/current_scan_results.json \
            --output_dir recent_downloads \
            --run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tender-results
          path: recent_downloads/

      - name: Send tender email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.mail_summary.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: Tender Bot <${{ secrets.SMTP_USERNAME }}>
          secure: true
          body: file://recent_downloads/mail_summary.txt
          attachments: ${{ steps.mail_summary.outputs.attachments }}
