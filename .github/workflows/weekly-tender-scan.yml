name: Weekly Tender Scan

on:
  workflow_dispatch:
  # Dagelijkse controle voor herstel; profiles/hob.json bepaalt het zondagritme.
  schedule:
    - cron: "15 2 * * *"
      timezone: Europe/Amsterdam

permissions:
  contents: read

concurrency:
  group: company-scan-hob
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/reusable-tender-scan.yml
    with:
      config: profiles/hob.json
      environment: hob
      send_email: true
      respect_schedule: ${{ github.event_name == 'schedule' }}
      use_database: true
    secrets: inherit
