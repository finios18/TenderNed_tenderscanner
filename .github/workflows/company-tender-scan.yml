name: Company Tender Scan

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Bedrijfsconfiguratie (bijvoorbeeld profiles/jan-snel.json)"
        required: true
        default: profiles/jan-snel.json
        type: string
      environment:
        description: "GitHub Environment met de secrets voor dit bedrijf"
        required: true
        default: jan-snel
        type: environment
      send_email:
        description: "Rapport e-mailen naar MAIL_TO uit het gekozen Environment"
        default: false
        type: boolean
      use_database:
        description: "Gebruik databasevoortgang (vereist migratie, retrieval-profiel en SCANNER_DATABASE_URL)"
        default: false
        type: boolean
      check_database_only:
        description: "Alleen databaseverbinding controleren; geen tenders, AI of e-mail"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: company-scan-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/reusable-tender-scan.yml
    with:
      config: ${{ inputs.config }}
      environment: ${{ inputs.environment }}
      send_email: ${{ inputs.send_email }}
      use_database: ${{ inputs.use_database || inputs.check_database_only }}
      check_database_only: ${{ inputs.check_database_only }}
    secrets: inherit
