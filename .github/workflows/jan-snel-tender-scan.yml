name: Jan Snel Tender Scan

on:
  workflow_dispatch:
    inputs:
      use_database:
        description: "Database-proef: vereist uitgevoerde migratie en SCANNER_DATABASE_URL"
        type: boolean
        default: false
  # Controleer dagelijks; het bedrijfsprofiel bepaalt welke dagen echt scannen.
  schedule:
    - cron: "15 7 * * *"
      timezone: Europe/Amsterdam

permissions:
  contents: read

concurrency:
  group: company-scan-jan-snel
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/reusable-tender-scan.yml
    with:
      config: profiles/jan-snel.json
      environment: jan-snel
      send_email: true
      respect_schedule: ${{ github.event_name == 'schedule' }}
      # Scheduled runs remain on the legacy route until a database trial succeeds.
      use_database: ${{ inputs.use_database == true }}
    secrets: inherit
